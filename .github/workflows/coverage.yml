name: Coverage Report

on:
  push:
    branches: [main]
  # Any base branch, so PRs stacked on other PRs get checked too.
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # jsdom 30 pulls in undici 8, which needs worker_threads.markAsUncloneable
      # (Node >=22.19). Keep this at or above jsdom's engines field.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test coverage
        run: bun run test:coverage

      - name: Coverage Report as Comment
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          delete-old-comments: true
          title: 'Test Coverage Report'
