name: E2E

# Separate from ci.yml so docs-only changes can skip the slow browser run
# without also skipping lint and the prettier check.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '.claude/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '.claude/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # jsdom 30 pulls in undici 8, which needs worker_threads.markAsUncloneable
      # (Node >=22.19). Keep this at or above jsdom's engines field.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --with-deps installs the system libraries the browsers need, which
      # `make install-playwright` doesn't, so run Playwright directly.
      - name: Install Playwright browsers
        run: bun x playwright install --with-deps

      - name: Run E2E tests
        run: bun x playwright test

      # Traces of failed attempts (trace: on-first-retry) are the only way to
      # debug a failure once the runner is gone.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
