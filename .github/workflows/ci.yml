name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # jsdom 30 pulls in undici 8, which needs worker_threads.markAsUncloneable
      # (Node >=22.19). Keep this at or above jsdom's engines field.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run formatter check
        run: bun x prettier --check .

      - name: Run tests with coverage
        run: bun run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # jsdom 30 pulls in undici 8, which needs worker_threads.markAsUncloneable
      # (Node >=22.19). Keep this at or above jsdom's engines field.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          VITE_GITHUB_REPO_URL: https://github.com/${{ github.repository }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: "pages"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    needs: [test, build]

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
